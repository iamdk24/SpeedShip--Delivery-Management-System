services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"

    depends_on:
      - db
      - redis

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
  
  celery:
    build: .
    command: ["celery", "-A", "app.worker.tasks", "worker", "--loglevel=info"]
    env_file:
      - .env


